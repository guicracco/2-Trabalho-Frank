<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratório de autenticação</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main>
<h1>Laboratório de autenticação</h1>
<p id="status">A sessão ainda não foi consultada.</p>
<div id="login-links">
<a href="/oauth/login/google">Entrar com Google</a>
<a href="/oauth/login/github">Entrar com GitHub</a>
</div>
<form method="post" action="/oauth/logout" id="logout-form" style="display:none;">
<button type="submit">Sair</button>
</form>
</main>
<script src="/app.js"></script>
  <body>
  <h1>Meu laboratório de login</h1>

  <button>Entrar com Google</button>
  <button>Entrar com GitHub</button>

  <div id="clima">Carregando clima...</div>

  <script>
    async function carregarClima(cidade) {
      const caixa = document.getElementById("clima");
      try {
        const resposta = await fetch("/api/clima?cidade=" + encodeURIComponent(cidade));
        const dados = await resposta.json();

        if (!resposta.ok) {
          caixa.textContent = dados.erro || "Erro ao carregar o clima";
          return;
        }

        caixa.innerHTML =
          '<img src="https://openweathermap.org/img/wn/' + dados.icone + '@2x.png" alt="">' +
          "<strong>" + dados.cidade + "</strong><br>" +
          Math.round(dados.temperatura) + " °C, " + dados.descricao + "<br>" +
          "Sensação de " + Math.round(dados.sensacao) + " °C | Umidade de " + dados.umidade + "%";
      } catch (e) {
        caixa.textContent = "Erro ao carregar o clima";
      }
    }

    carregarClima("Curitiba");
  </script>
</body>
</body>
</html>
